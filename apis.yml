aid: iproov

name: iProov

description: 'iProov is a biometric identity verification, onboarding, and authentication company that uses science-based facial liveness detection
  to protect organizations from deepfakes, identity fraud, and AI-generated attacks. It provides biometric capture, matching, and liveness capabilities
  for remote onboarding and authentication, delivered through a server REST API and client SDKs for iOS, Android, Web, Flutter, React Native and
  .NET MAUI, with the iPortal customer portal for configuration. Legal entity: iProov Ltd.'

