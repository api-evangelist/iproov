apis:
- aid: iproov:iportal-api
  name: iPortal API
  description: >-
    Machine-to-machine management API for iPortal: a service account exchanges its key and secret (HTTP
    Basic) at POST /auth/token for a 15-minute JWT, then creates service providers (POST /service-providers),
    resets their credentials (POST /service-providers/{apiKey}/reset) and checks health (GET /status,
    GET /ready). Must be enabled by iProov; the host is replaced per region.
  humanURL: https://docs.iproov.com/iportal/iportal-api
  baseURL: https://portal.iproov.com/management
  tags:
  - Administration
  properties:
  - type: Documentation
    url: https://docs.iproov.com/iportal/iportal-api
  x-contract-source: >-
    No published contract found: portal.iproov.com/management/openapi.json and /swagger.json return the
    iPortal SPA HTML shell (200 text/html), not a spec (probed 2026-10-18).
